			<p>
				<span class="verse">1</span> A <em>terra</em> é todo; a <em>terra</em> é le bono e le málo;<br>
				<span class="verse">2</span> a <em>terra</em> é todo vivéndo e todo mordo;<br>
				<span class="verse">3</span> a <em>terra</em> fé, é, e ére;<br>
				<span class="verse">4</span> a <em>terra</em> fé, é, e ére;<br>
				<span class="verse">5</span> a <em>terra</em> no tene un començo e a <em>terra</em> no tene un fino;<br>
				<span class="verse">6</span> a <em>terra</em> é "éu" e "tu";<br>
				<span class="verse">7</span> a <em>terra</em> é "lí" e "tero";<br>
				<span class="verse">8</span> a <em>terra</em> é començo e fino e sembre e jamás.<br>
