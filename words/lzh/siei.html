		<div class="word">
			<h1>⚖️ 善惡道第一</h1>
			<p>
				<span class="verse">㊀</span> 惡不計於人迫汝<br>
				<span class="verse">㊁</span> 為惡 然他人<br>
				<span class="verse">㊂</span> 受苦 惡乃計<br>
			</p>
		</div>
		<div class="word">
			<h1>⚖️ 善惡道第二</h1>
			<p>
				<span class="verse">㊀</span> νοιχαι σε χαι να δα βιαϋ νοι, κεν<br>
				<span class="verse">㊁</span> νιεχαι να δα δος φοκ.<br>
			</p>
		</div>
		<div class="word">
			<h1>⚖️ 善惡道第三</h1>
			<p>
				<span class="verse">㊀</span> τιει κιε χαι δα δος κεν βιαϋ τεκ νοι,<br>
				<span class="verse">㊁</span> ο-βιαϋ νιε τεκ νοι να ω'νωε,<br>
				<span class="verse">㊂</span> βιει ω'νωε χαι νοι δα'ιε, νας<br>
				<span class="verse">㊃</span> κιε.<br>
			</p>
		</div>
