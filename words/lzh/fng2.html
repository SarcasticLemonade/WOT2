		<div class="word">
			<h1>🥠 子言第一</h1>
			<p>
				<span class="verse">㊀</span> 子曰、毋逢<br>
				<span class="verse">㊁</span> 其日、戰起於無之<br>
				<span class="verse">㊂</span> 時、毋逢其日、<br>
				<span class="verse">㊃</span> 幼者賣其心於肉、於未<br>
				<span class="verse">㊄</span> 能言之前、毋逢<br>
				<span class="verse">㊅</span> 其日、謂愛為罪、<br>
				<span class="verse">㊆</span> 毋逢其日、至明<br>
				<span class="verse">㊇</span> 之明不識樹木、<br>
				<span class="verse">㊈</span> 曰子。<br>
			</p>
		</div>
		<div class="word">
			<h1>🥠 子言第二</h1>
			<p>
				<span class="verse">㊀</span> 子曰、坤之<br>
				<span class="verse">㊁</span> 於人、人亦將以之於坤、<br>
				<span class="verse">㊂</span> 坤之於人、人亦將以之於<br>
				<span class="verse">㊃</span> 獸、愛之者謝<br>
				<span class="verse">㊄</span> 愛己者、惡之者示<br>
				<span class="verse">㊅</span> 忘恩於愛己者、曰<br>
				<span class="verse">㊆</span> 子。<br>
			</p>
		</div>
