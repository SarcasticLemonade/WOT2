		<div class="word">
			<h1>🌍 <em>Фе́ри́н</em> 1</h1>
			<p>
				<span class="verse">1</span> <em>фе́ран</em> eң τεκ; <em>фе́ран</em> eң νοι κεν φοκ;<br>
				<span class="verse">2</span> <em>фе́ран</em> eң τεκ βενγε κεν τεκ γεςγε;<br>
				<span class="verse">3</span> <em>фе́ран</em> бең, eң, сера́ңкам;<br>
				<span class="verse">4</span> <em>фе́ран</em> ιεςκα, ιες, κεν ιεςτε;<br>
				<span class="verse">5</span> <em>фе́ран</em> μαι νιος σοι κεν <em>фе́ран</em> μαι νιος τες;<br>
				<span class="verse">6</span> <em>фе́ран</em> eң "μιε" κεν "κιε";<br>
				<span class="verse">7</span> <em>фе́ран</em> eң "λιε" κεν "γιο";<br>
				<span class="verse">8</span> <em>фе́ран</em> eң σοι κεν τες κεν γϋεν κεν νϋεν.<br>
			</p>
