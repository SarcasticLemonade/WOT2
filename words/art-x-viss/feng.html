			<h1>🌍 כֳ נְ אֶשֶּפֻּת א</h1>
			<p>
				<span class="verse">א</span> אִשְן מָשָ· אִשְן אִכָּוַת כַ פַשָּרַּת·<br>
				<span class="verse">ב</span> אִשְן מָשָ שַ גֳרֳשָ כא מָשָ שַ בֶשֶכָּ·<br>
				<span class="verse">ג</span> אִש נֶ· נֻ כַ נִי·<br>
				<span class="verse">ד</span> אִש שֻנת· שֻנפּ כַ שֻנטִי·<br>
				<span class="verse">ה</span> אִש מֶנְ אְלִי רַכצֳ כְאִש מֶנְ אְלִי רִּטֳּ·<br>
				<span class="verse">ו</span> אִשְן "מִן" כַ "בִן"·<br>
				<span class="verse">ז</span> אִשְן "לִים" כַ "מֻש"·<br>
				<span class="verse">ח</span> אִשְן רַכצַ כַ רִּט כַ סָוִדּ כְאֶלִים·<br>
			</p>
