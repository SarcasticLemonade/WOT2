			<h1>⚖️ Dz 1</h1>
			<p><sup>1</sup> φοκ σιαι νιε κεϋ σος εν να φοκληγε<br><sup>2</sup> δα φοκλη, καν κεϋ ιεςκα φοκ να<br><sup>3</sup> γε ω'νω, φοκ σιαι.<br></p>
		</div>
		<div class="word">
			<h1>⚖️ Dz 2</h1>
			<p><sup>1</sup> νοιχαι σε χαι να δα βιαϋ νοι, κεν<br><sup>2</sup> νιεχαι να δα δος φοκ.<br></p>
		</div>
		<div class="word">
			<h1>⚖️ Dz 3</h1>
			<p><sup>1</sup> τιει κιε χαι δα δος κεν βιαϋ τεκ νοι,<br><sup>2</sup> ο-βιαϋ νιε τεκ νοι να ω'νωε,<br><sup>3</sup> βιει ω'νωε χαι νοι δα'ιε, νας<br><sup>4</sup> κιε.<br></p>
