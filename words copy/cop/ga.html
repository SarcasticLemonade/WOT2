			<h1>🎭 φε να γα 1</h1>
			<p><sup>1</sup> κοι νοιιες γα σε ρο χεϋ κωϋ να τεκ<br><sup>2</sup> γε βεν. γα σε, σε'κα, κεν<br><sup>3</sup> σετε χαι νε τεκ γε εκ φεκ. γα<br><sup>4</sup> μοκ δος μιεϋ κεν λα νοιφεκνω βιει γα σε<br><sup>5</sup> φεκνοι. τεκ γε εκ φεκ χαι γα κεν<br><sup>6</sup> δης μα γα, βιει νιε'ιες βεν κεϋ ιες<br><sup>7</sup> νιος γα, νιος λη, νιος λα, κεν<br><sup>8</sup> κεϋ ιες νιος λει.<br></p>
