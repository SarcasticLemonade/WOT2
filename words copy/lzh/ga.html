			<h1>🍲 食道一</h1>
			<p><sup>1</sup> 愛有三種：有家愛、<br><sup>2</sup> 有普愛及有愛情。<br><sup>3</sup> 家愛是家中<br><sup>4</sup> 眾人相助且互<br><sup>5</sup> 善之願。家愛當存、除非<br><sup>6</sup> 家中一人犯大罪。<br><sup>7</sup> 當懷普愛且施於<br><sup>8</sup> 天下人：善人惡人、<br><sup>9</sup> 惰者奇者。愛情<br><sup>10</sup> 當專一人、蓋<br><sup>11</sup> 此結乃如是之物<br><sup>12</sup> 人不可復與他人為既<br><sup>13</sup> 與人結之後。<br></p>
