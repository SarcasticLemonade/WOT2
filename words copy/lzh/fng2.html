			<h1>📖 聖之次言一</h1>
			<p><sup>1</sup> 子曰：「勿<br><sup>2</sup> 致其日戰起於<br><sup>3</sup> 虛；勿致其日<br><sup>4</sup> 童賣心於肉未<br><sup>5</sup> 能言；勿<br><sup>6</sup> 致其日謂愛為罪；<br><sup>7</sup> 勿致其日至明之<br><sup>8</sup> 明不知木何也，」<br><sup>9</sup> 曰子。<br></p>
